[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eurotrek"
version = "0.1.0"
description = "UK to Central Europe flight and train timetable checker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
]

[project.scripts]
eurotrek = "eurotrek.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eurotrek"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
